<section id="otp-panel" class="panel" hidden aria-labelledby="otp-title">
  <p class="eyebrow">EMAIL VERIFICATION</p>
  <h1 id="otp-title" tabindex="-1">이메일 인증</h1>
  <p id="masked-email" class="lead"></p>
  <p class="muted">
    초대받은 이메일로 6자리 인증번호를 전송합니다. 이 절차는 이메일함 소유 확인이며
    공인전자서명이나 별도의 2단계 인증을 의미하지 않습니다.
  </p>
  <div id="otp-request-actions">
    <button id="request-otp-button" type="button">인증번호 받기</button>
  </div>
  <form id="otp-form" hidden novalidate>
    <label for="otp-code">6자리 인증번호</label>
    <input
      id="otp-code"
      name="otp"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      pattern="[0-9]{6}"
      required
    >
    <button type="submit">인증하고 계약서 열기</button>
    <button id="resend-otp-button" class="secondary" type="button" disabled>
      새 인증번호 받기
    </button>
    <p id="otp-timer" class="muted" aria-live="polite"></p>
  </form>
  <button id="retry-contract-load-button" class="secondary" type="button" hidden>
    인증된 계약서 다시 불러오기
  </button>
</section>
