<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Viewport QA</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:24px;min-width:max-content;background:#202630}
    iframe{display:block;border:0;background:#fff;box-shadow:0 0 0 1px #677180}
  </style>
</head>
<body>
  <iframe id="page" title="Company viewport QA"></iframe>
  <script>
    const p=new URLSearchParams(location.search);
    const w=Math.max(320,Math.min(820,Number(p.get('w'))||390));
    const h=Math.max(640,Math.min(1200,Number(p.get('h'))||844));
    const v=p.get('v')||'latest';
    const f=document.querySelector('#page');
    f.width=String(w); f.height=String(h); f.src='/company/?qa='+encodeURIComponent(v);
  </script>
</body>
</html>
