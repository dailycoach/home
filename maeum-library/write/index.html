<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>기록 작성 | 마음서재</title>
  <meta name="theme-color" content="#f3eadb">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://daily-coach-ing.com/maeum-library/write/">
  <link rel="stylesheet" href="/maeum-library/assets/styles.css">
</head>
<body class="form-page">
  <a class="skip" href="#main">본문 바로가기</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/maeum-library/"><strong>마음서재</strong><span>WRITE ONE SENTENCE</span></a>
      <nav class="desktop-nav" aria-label="주요 메뉴"><a href="/maeum-library/">홈</a><a href="/maeum-library/library/">한줄톡</a><a aria-current="page" href="/maeum-library/write/">기록 작성</a><a href="/maeum-library/me/">내 기록</a></nav>
      <button class="menu-button" type="button" data-menu-button aria-expanded="false" aria-controls="mobile-menu">메뉴</button>
    </div>
  </header>
  <nav class="mobile-menu" id="mobile-menu" data-mobile-menu aria-label="모바일 메뉴"><a href="/maeum-library/">홈</a><a href="/maeum-library/library/">한줄톡</a><a href="/maeum-library/write/">기록 작성</a><a href="/maeum-library/me/">내 기록</a></nav>
  <main id="main" class="page-shell">
    <section class="page-hero">
      <p class="eyebrow">WRITE ONE SENTENCE</p>
      <h1>마음이 멈춘 한 문장</h1>
      <p>기록은 비공개로 시작합니다. 원할 때만 이름 없이 공개 한줄톡 서재에 공유할 수 있습니다.</p>
    </section>
    <section class="form-card">
      <h2>읽은 양보다<br>마음에 남은 장면을 씁니다.</h2>
      <p class="intro" id="write-help">아직 연결하지 않았다면 먼저 <a href="/maeum-library/connect/">참여자 연결</a>을 완료해 주세요.</p>
      <form data-write-form aria-describedby="write-help write-status">
        <div class="field-grid">
          <label>책 제목<input type="text" name="bookTitle" maxlength="120" required></label>
          <label>저자<input type="text" name="bookAuthor" maxlength="80"></label>
          <label class="wide">마음이 멈춘 문장<textarea name="quotedLine" rows="3" maxlength="220" required></textarea></label>
          <label class="wide">떠오른 삶의 장면<textarea name="reflection" rows="5" maxlength="800" required></textarea></label>
          <label>서가<select name="theme"><option>온기 서가</option><option>정돈 서가</option><option>불씨 서가</option><option>숨결 서가</option><option>나침반 서가</option></select></label>
          <label>다음 한 걸음<textarea name="chosenStep" rows="3" maxlength="500" required></textarea></label>
          <label class="wide check-field"><input type="checkbox" name="shareConsent" value="yes"><span>이 기록을 이름 없이 공개 한줄톡 서재에 공유합니다. 선택하지 않으면 비공개로 저장됩니다.</span></label>
        </div>
        <div class="form-actions"><button class="button accent" type="submit">한 문장 기록하기</button><a class="button ghost" href="/maeum-library/me/">내 기록 보기</a></div>
      </form>
      <p class="form-message" id="write-status" data-form-message role="status" aria-live="polite" hidden></p>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div><strong>마음서재</strong><p>공개 여부는 내 기록에서 언제든 변경할 수 있습니다.</p></div>
      <div class="footer-links"><a href="/maeum-library/privacy/">개인정보</a><a href="/maeum-library/terms/">이용약관</a></div>
      <div class="footer-note">입력 내용에는 HTML을 허용하지 않으며 길이를 제한합니다.</div>
    </div>
  </footer>
  <script src="/maeum-library/assets/app.js?v=20260806-feed-recovery-v1" defer></script>
</body>
</html>
