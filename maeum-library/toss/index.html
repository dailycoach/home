<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>토스 마음서재 열기 | 마음서재</title>
  <meta name="description" content="토스에서 독서 문장을 기록하고 한줄톡과 독서모임으로 이어지는 마음서재 진입 페이지">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://daily-coach-ing.com/maeum-library/toss/">
  <link rel="stylesheet" href="/maeum-library/assets/styles.css?v=20261031-simple">
  <link rel="stylesheet" href="/maeum-library/assets/reading-journey.css?v=20261031-1">
  <!-- Single Toss entry gateway: intoss primary, share-link fallback -->
</head>
<body class="connect-page">
  <a class="skip" href="#main">본문 바로가기</a>
  <main id="main" class="page-shell">
    <section class="page-hero">
      <p class="eyebrow">RECORD IN TOSS</p>
      <h1>책에서 만난 한 문장,<br>토스에 남겨보세요.</h1>
      <p>휴대전화에서는 토스 마음서재를 자동으로 엽니다. 열리지 않으면 아래 버튼을 눌러주세요.</p>
      <div class="hero-actions">
        <a id="open-toss" class="button accent" href="intoss://maum-library-entry">토스에서 기록하기</a>
        <a class="button ghost" href="https://minion.toss.im/FZZaAaJp">토스 연결이 안 될 때</a>
      </div>
      <p class="form-message" id="toss-status" role="status" aria-live="polite">토스 앱 연결을 준비하고 있습니다.</p>
      <div class="toss-choices" aria-label="웹에서 계속하기">
        <div class="toss-choice">
          <h2>다른 사람의 문장 읽기</h2>
          <p>한줄톡은 토스 연결 없이 둘러볼 수 있습니다.</p>
          <a href="/maeum-library/library/">한줄톡으로 가기 →</a>
        </div>
        <div class="toss-choice">
          <h2>함께 읽는 모임</h2>
          <p>독서모임의 진행 방식과 참여 안내를 확인할 수 있습니다.</p>
          <a href="/maeum-library/gathering/">독서모임 보기 →</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const DEEP_LINK = 'intoss://maum-library-entry';
      const FALLBACK_LINK = 'https://minion.toss.im/FZZaAaJp';
      const status = document.getElementById('toss-status');
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      let leftPage = false;
      let fallbackTimer;

      const cancelFallback = () => {
        leftPage = true;
        if (fallbackTimer) clearTimeout(fallbackTimer);
      };

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) cancelFallback();
      });
      window.addEventListener('pagehide', cancelFallback, { once: true });
      window.addEventListener('blur', () => {
        if (document.hidden) cancelFallback();
      });

      if (!isMobile) {
        status.textContent = '컴퓨터에서는 토스 앱이 자동으로 열리지 않습니다. 휴대전화에서 이 페이지를 열거나 공유 링크를 이용해 주세요.';
        return;
      }

      try {
        window.location.href = DEEP_LINK;
      } catch (_) {
        status.textContent = '자동 연결이 되지 않았습니다. 아래 버튼을 눌러주세요.';
      }

      fallbackTimer = window.setTimeout(() => {
        if (leftPage || document.hidden) return;
        status.textContent = '토스 앱이 열리지 않으면 공유 링크로 연결합니다.';
        window.location.replace(FALLBACK_LINK);
      }, 2200);
    })();
  </script>
</body>
</html>
