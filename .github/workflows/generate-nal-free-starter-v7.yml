name: NAL Free Starter v7 Generate

on:
  push:
    branches:
      - main
      - fix/nal-free-three-v7-direct
    paths:
      - "scripts/generate-nal-free-starter-v7.py"
      - "nal/data/nal-free-small-book-v7-*.json"
      - ".github/workflows/generate-nal-free-starter-v7.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF generator
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5
      - name: Generate free PDFs
        run: python scripts/generate-nal-free-starter-v7.py
      - name: Commit generated PDFs
        run: |
          if [ -z "$(git status --porcelain -- nal/assets/downloads/free/nal-small-book-01-mind-reset-v7.pdf nal/assets/downloads/free/nal-small-book-02-relationship-v7.pdf nal/assets/downloads/free/nal-small-book-03-next-step-v7.pdf)" ]; then
            echo "No generated PDF changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nal/assets/downloads/free/nal-small-book-01-mind-reset-v7.pdf
          git add nal/assets/downloads/free/nal-small-book-02-relationship-v7.pdf
          git add nal/assets/downloads/free/nal-small-book-03-next-step-v7.pdf
          git commit -m "build: generate NAL free starter v7 PDFs [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"