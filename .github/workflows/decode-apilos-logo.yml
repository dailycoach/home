name: Materialize APILOS YCC Logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decode-apilos-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apilos-logo-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode canonical YCC logo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          src = Path('apilos/assets/ycc-logo-base64.txt')
          dst = Path('apilos/assets/ycc-logo.webp')
          data = base64.b64decode(src.read_text(encoding='utf-8').strip(), validate=True)
          if not data.startswith(b'RIFF') or b'WEBP' not in data[:16]:
              raise SystemExit('Decoded logo is not WebP')
          dst.write_bytes(data)
          print('materialized', dst, len(data), 'bytes')
          PY
      - name: Commit binary logo when changed
        shell: bash
        run: |
          if git diff --quiet -- apilos/assets/ycc-logo.webp && git ls-files --error-unmatch apilos/assets/ycc-logo.webp >/dev/null 2>&1; then
            echo "Logo already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apilos/assets/ycc-logo.webp
          git commit -m "Materialize APILOS YCC logo"
          git pull --rebase origin main
          git push origin HEAD:main
