name: NAL Positive Writing v2 Assets

on:
  push:
    branches:
      - feat/nal-positive-writing-free-v2
    paths:
      - scripts/nal-positive-writing-v2-source.b64
      - .github/workflows/nal-positive-writing-assets-v2.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --disable-pip-version-check reportlab==4.2.5 pymupdf==1.24.14 Pillow==11.3.0
      - name: Expand verified production renderer
        run: |
          python - <<'PY'
          import base64, bz2, hashlib
          from pathlib import Path
          compressed = base64.b64decode(Path('scripts/nal-positive-writing-v2-source.b64').read_text().strip(), validate=True)
          source = bz2.decompress(compressed)
          actual = hashlib.sha256(source).hexdigest()
          expected = '0ccdbda535accc73468711bb6c676875158f6eb8dcbb29eee1c81627e9ae4689'
          assert actual == expected, f'Source integrity mismatch: {actual}'
          script = source.decode('utf8')
          script = script.replace("ROOT=Path('/mnt/data')", "ROOT=Path(__file__).resolve().parents[1] / '.nal-positive-writing-generated'")
          script = script.replace("OUT=ROOT", "OUT=ROOT\nOUT.mkdir(parents=True, exist_ok=True)")
          assert '.nal-positive-writing-generated' in script
          Path('scripts/generate-nal-positive-writing-v2.py').write_text(script, encoding='utf8')
          print('verified source', actual, 'length', len(script))
          PY
      - name: Generate four publication assets
        run: python scripts/generate-nal-positive-writing-v2.py
      - name: Validate PDFs and stage public assets
        run: |
          python - <<'PY'
          import fitz, shutil
          from pathlib import Path
          from PIL import Image
          generated = Path('.nal-positive-writing-generated')
          p_root = Path('nal/assets/downloads/free')
          i_root = Path('nal/assets/images/catalog/shop/retail')
          p_root.mkdir(parents=True, exist_ok=True)
          i_root.mkdir(parents=True, exist_ok=True)
          expected = [
            ('NAL_긍정문장_따라쓰기_v2_A5_소책자.pdf', 'nal-positive-writing-14days-v2-a5.pdf',0),
            ('NAL_긍정문장_따라쓰기_v2_A4_흑백인쇄.pdf', 'nal-positive-writing-14days-v2-a4-print.pdf',0),
            ('NAL_긍정문장_따라쓰기_v2_디지털입력형.pdf', 'nal-positive-writing-14days-v2-fillable.pdf',52),
          ]
          for source, destination, widgets in expected:
              src = generated / source
              doc = fitz.open(src)
              assert len(doc)==40, (source, len(doc))
              count=sum(len(list(p.widgets() or [])) for p in doc)
              assert count==widgets, (source,count,widgets)
              assert src.stat().st_size>200_000
              shutil.copy2(src,p_root/destination)
              print(destination,src.stat().st_size,'bytes',count,'fields')
          im=Image.open(generated/'NAL_긍정문장_따라쓰기_v2_스토어표지.png')
          assert im.size == (1200,1600), im.size
          shutil.copy2(generated/'NAL_긍정문장_따라쓰기_v2_스토어표지.png',i_root/'nal-positive-writing-14days-v2-cover.png')
          print('Asset checks PASS')
          PY
      - name: Commit verified PDFs and cover to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-nal-positive-writing-v2.py
          git add nal/assets/downloads/free/nal-positive-writing-14days-v2-a5.pdf
          git add nal/assets/downloads/free/nal-positive-writing-14days-v2-a4-print.pdf
          git add nal/assets/downloads/free/nal-positive-writing-14days-v2-fillable.pdf
          git add nal/assets/images/catalog/shop/retail/nal-positive-writing-14days-v2-cover.png
          if git diff --cached --quiet; then
            echo "Assets already up to date"
            exit 0
          fi
          git commit -m "assets(nal): release positive writing 14-day workbook v2 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
