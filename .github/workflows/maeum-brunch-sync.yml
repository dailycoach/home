name: Update Maeum Library Brunch RSS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maeum-brunch-sync.yml"
      - "scripts/sync-maeum-brunch.py"
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maeum-brunch-rss
  cancel-in-progress: false

jobs:
  update-brunch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch DAILYCOACHING Brunch RSS
        run: python3 scripts/sync-maeum-brunch.py

      - name: Commit new articles when changed
        shell: bash
        run: |
          if git diff --quiet -- maeum-library/assets/brunch-posts.json; then
            echo "No new Brunch posts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maeum-library/assets/brunch-posts.json
          git commit -m "Update Maeum Library Brunch articles"
          git pull --rebase origin main
          git push origin HEAD:main
