# W1 gate: daily engine + browser flow
name: NAL READ W1 CI

on:
  push:
    branches:
      - feat/nal-read-v1
    paths:
      - "docs/NAL_READ_WAVE1_SCHEMA_DRAFT.sql"
      - "scripts/test-nal-read-wave1-db-cases.sql"
      - "scripts/nal-read-wave1-browser-qa.mjs"
      - "nal/assets/js/read-daily.js"
      - "nal/assets/css/nal-read.css"
      - "nal/read/trend-2027/before/**"
      - "nal/read/trend-2027/today/**"
      - "nal/read/trend-2027/journey/**"
      - "nal/read/trend-2027/day/**"
      - "supabase/functions/nal-read-daily/**"
      - "supabase/migrations/*nal_read_wave1*"
      - ".github/workflows/nal-read-wave1-ci.yml"
  pull_request:
    paths:
      - "docs/NAL_READ_WAVE1_SCHEMA_DRAFT.sql"
      - "scripts/test-nal-read-wave1-db-cases.sql"
      - "scripts/nal-read-wave1-browser-qa.mjs"
      - "nal/assets/js/read-daily.js"
      - "nal/assets/css/nal-read.css"
      - "nal/read/trend-2027/before/**"
      - "nal/read/trend-2027/today/**"
      - "nal/read/trend-2027/journey/**"
      - "nal/read/trend-2027/day/**"
      - "supabase/functions/nal-read-daily/**"
      - "supabase/migrations/*nal_read_wave1*"
      - ".github/workflows/nal-read-wave1-ci.yml"

permissions:
  contents: read

jobs:
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nal_read_w1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nal_read_w1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check W1 JavaScript syntax
        run: |
          node --check nal/assets/js/read-daily.js
          node --check supabase/functions/nal-read-daily/handler.mjs
          node --check supabase/functions/nal-read-daily/handler.test.mjs
      - name: Test W1 Edge handler
        run: node supabase/functions/nal-read-daily/handler.test.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null
      - name: Verify PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          version="$(psql -h localhost -U postgres -d nal_read_w1 -Atc 'show server_version_num')"
          echo "PostgreSQL server_version_num=$version"
          test "$version" -ge 170000 -a "$version" -lt 180000
      - name: Test W1 daily engine
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d nal_read_w1 -f scripts/test-nal-read-db-fixture.sql
          psql -h localhost -U postgres -d nal_read_w1 -f supabase/migrations/20261006095820_nal_read_wave0_foundation.sql
          psql -h localhost -U postgres -d nal_read_w1 -f supabase/migrations/20261006095938_nal_read_wave0_index_hardening.sql
          psql -h localhost -U postgres -d nal_read_w1 -f docs/NAL_READ_WAVE1_SCHEMA_DRAFT.sql
          psql -h localhost -U postgres -d nal_read_w1 -f scripts/test-nal-read-wave1-db-cases.sql
      - name: Install browser QA dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test W1 browser flows
        run: node scripts/nal-read-wave1-browser-qa.mjs
