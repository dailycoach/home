name: Check LMC Order Bridge

on:
  pull_request:
    paths:
      - "lcms/academy/order-bridge/**"
      - ".github/workflows/check-lmc-order-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lcms/academy/order-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
