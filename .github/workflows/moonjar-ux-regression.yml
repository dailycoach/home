name: Moonjar UX Regression

on:
  pull_request:
    paths:
      - 'activities/moonjar/**'
      - 'tests/moonjar/**'
      - 'scripts/check-moonjar.mjs'
      - 'scripts/check-moonjar-browser.mjs'
      - 'scripts/check-moonjar-nacre96.mjs'
      - 'scripts/check-moonjar-release.mjs'
      - 'scripts/check-moonjar-viewport.mjs'
      - 'scripts/check-moonjar-atelier.mjs'
      - 'scripts/check-moonjar-refinement.mjs'
      - 'scripts/check-moonjar-art-direction.mjs'
      - 'scripts/moonjar-browser-helpers.mjs'
      - '.github/workflows/moonjar-ux-regression.yml'

permissions:
  contents: read

concurrency:
  group: moonjar-release-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original assets and JS syntax
        run: node scripts/check-moonjar.mjs
      - name: Test Moonjar domain, storage and UX wiring
        run: node --test tests/moonjar/*.test.js

  browser-smoke:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve the real static Moonjar page
        run: |
          python3 -m http.server 4173 >/tmp/moonjar-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/activities/moonjar/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/moonjar-http.log
          exit 1
      - name: Mobile and desktop Chromium smoke
        run: node scripts/check-moonjar-browser.mjs
      - name: Check all 96 source images on day and night porcelain
        run: node scripts/check-moonjar-nacre96.mjs
      - name: Verify Atelier V3 start, local privacy, legacy import and output pixels
        env:
          MOONJAR_CHROMIUM_ONLY: '1'
        run: node scripts/check-moonjar-atelier.mjs
      - name: Attach Atelier V3 actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonjar-atelier-v3-review
          path: artifacts/moonjar-atelier-v3
          retention-days: 14
      - name: Attach nacre source visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonjar-nacre96-visual-qa
          path: artifacts/moonjar-nacre96
          retention-days: 7
      - name: Attach browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonjar-mobile-ux-qa
          path: artifacts/moonjar-mobile-ux-qa
          retention-days: 7

  release-matrix:
    needs: browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit for emulation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Serve independent static Moonjar app
        run: |
          python3 -m http.server 4173 >/tmp/moonjar-release-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/activities/moonjar/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/moonjar-release-http.log
          exit 1
      - name: Run touch, responsive, privacy and 160-piece matrix
        run: node scripts/check-moonjar-release.mjs
      - name: Run single-screen compact, landscape and journal matrix
        run: node scripts/check-moonjar-viewport.mjs
      - name: Verify V3.1 legibility, larger mobile artwork and gallery resume
        run: node scripts/check-moonjar-refinement.mjs
      - name: Verify V3.2 whole silhouettes, artwork geometry and archive fixtures
        run: node scripts/check-moonjar-art-direction.mjs
      - name: Attach V3.2 actual art direction and action geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonjar-art-direction-v32
          path: artifacts/moonjar-art-direction-v32
          retention-days: 14
      - name: Attach V3.1 responsive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonjar-refinement-v31
          path: artifacts/moonjar-refinement-v31
          retention-days: 14
      - name: Attach one-screen screenshot and geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonjar-viewport-review
          path: artifacts/moonjar-viewport
          retention-days: 7
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonjar-release-matrix
          path: artifacts/moonjar-release-matrix
          retention-days: 7
