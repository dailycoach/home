name: NAL READ W0 CI

on:
  push:
    branches:
      - feat/nal-read-v1
    paths:
      - "nal/read/**"
      - "nal/assets/js/read.js"
      - "nal/assets/css/nal-read.css"
      - "nal/data/read-*.json"
      - "supabase/functions/nal-read-enroll/**"
      - "docs/NAL_READ_WAVE0_SCHEMA_DRAFT.sql"
      - "supabase/migrations/*nal_read*"
      - "scripts/check-nal-read-wave0.mjs"
      - "scripts/test-nal-read-db-*.sql"
      - "scripts/nal-read-browser-qa.mjs"
      - ".github/workflows/nal-read-wave0-ci.yml"
  pull_request:
    paths:
      - "nal/read/**"
      - "nal/assets/js/read.js"
      - "nal/assets/css/nal-read.css"
      - "nal/data/read-*.json"
      - "supabase/functions/nal-read-enroll/**"
      - "docs/NAL_READ_WAVE0_SCHEMA_DRAFT.sql"
      - "supabase/migrations/*nal_read*"
      - "scripts/check-nal-read-wave0.mjs"
      - "scripts/test-nal-read-db-*.sql"
      - "scripts/nal-read-browser-qa.mjs"
      - ".github/workflows/nal-read-wave0-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nal_read_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nal_read_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check nal/assets/js/read.js
          node --check supabase/functions/nal-read-enroll/handler.mjs
          node --check supabase/functions/nal-read-enroll/handler.test.mjs
      - name: Test READ enrollment handler
        run: node supabase/functions/nal-read-enroll/handler.test.mjs
      - name: Check READ W0 static contract
        run: node scripts/check-nal-read-wave0.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null
      - name: Test W0 schema on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          version="$(psql -h localhost -U postgres -d nal_read_test -Atc 'show server_version_num')"
          echo "PostgreSQL server_version_num=$version"
          test "$version" -ge 170000 -a "$version" -lt 180000
          psql -h localhost -U postgres -d nal_read_test -f scripts/test-nal-read-db-fixture.sql
          psql -h localhost -U postgres -d nal_read_test -f docs/NAL_READ_WAVE0_SCHEMA_DRAFT.sql
          psql -h localhost -U postgres -d nal_read_test -f scripts/test-nal-read-db-cases.sql
      - name: Install browser QA dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run zero-cost READ browser QA
        run: node scripts/nal-read-browser-qa.mjs
      - name: Confirm W0 change isolation
        shell: bash
        run: |
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(.github/workflows/nal-read-wave0-ci.yml|docs/NAL_READ_WAVE0_SCHEMA_DRAFT.sql|nal/read/|nal/assets/js/read.js$|nal/assets/css/nal-read.css$|nal/data/read-[^/]+[.]json$|scripts/check-nal-read-wave0.mjs$|scripts/test-nal-read-db-[^/]+[.]sql$|scripts/nal-read-browser-qa.mjs$|supabase/migrations/[^/]*nal_read[^/]*[.]sql$|supabase/functions/nal-read-enroll/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected W0 changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Run shared NAL regression QA for READ surfaces
        shell: bash
        run: |
          set +e
          output="$(node scripts/check-nal-platform.mjs 2>&1)"
          status=$?
          set -e
          echo "$output"
          if printf '%s\n' "$output" | grep -F 'nal/read/'; then
            echo "READ introduced a shared NAL QA failure."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Shared NAL QA has pre-existing failures outside /nal/read/; no READ-specific regression found."
          fi
