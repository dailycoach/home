name: NAL Toss payments CI

on:
  push:
    branches:
      - feat/nal-toss-payments-v1
    paths:
      - "supabase/functions/nal-toss-**"
      - "supabase/migrations/*nal_toss*"
      - "scripts/test-nal-toss-payments.mjs"
      - ".github/workflows/nal-toss-payments-ci.yml"
  pull_request:
    paths:
      - "supabase/functions/nal-toss-**"
      - "supabase/migrations/*nal_toss*"
      - "scripts/test-nal-toss-payments.mjs"
      - ".github/workflows/nal-toss-payments-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test payment handlers
        run: node scripts/test-nal-toss-payments.mjs
