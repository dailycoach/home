name: Check LMC Privacy Rework

on:
  pull_request:
    paths:
      - "lcms/academy/privacy/**"
      - "scripts/lmc-zoom-tile-privacy.mjs"
      - ".github/workflows/check-lmc-privacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check script syntax
        run: node --check scripts/lmc-zoom-tile-privacy.mjs
      - name: Generate 77-row review config
        run: |
          node scripts/lmc-zoom-tile-privacy.mjs init --config /tmp/lmc-zoom-tile-masks.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/lmc-zoom-tile-masks.json', 'utf8'));
          const rows = Object.values(config.media || {});
          if (rows.length !== 77) throw new Error(`Expected 77 rows, got ${rows.length}`);
          if (rows.some((row) => row.decision !== 'REVIEW_REQUIRED')) {
            throw new Error('Initial privacy rows must all be REVIEW_REQUIRED');
          }
          console.log('LMC privacy config check passed: 77 REVIEW_REQUIRED rows.');
          NODE
