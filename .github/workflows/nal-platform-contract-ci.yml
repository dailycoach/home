name: NAL Platform Contract CI

on:
  pull_request:
    paths:
      - "scripts/check-nal-platform.mjs"
      - "scripts/test-nal-platform-contract-guards.mjs"
      - "scripts/nal-catalog-contract.mjs"
      - "scripts/test-nal-catalog-contract.mjs"
      - "scripts/check-nal-catalog-consistency.mjs"
      - "scripts/check-nal-read-integration-snapshot.mjs"
      - "scripts/test-nal-read-integration-negative.mjs"
      - "scripts/check-nal-privacy-release-lock.mjs"
      - "scripts/test-nal-privacy-lock-negative.mjs"
      - "scripts/test-nal-privacy-owner-ui.mjs"
      - "scripts/test-nal-privacy-auth-reference.mjs"
      - "integration/nal-stabilization-04/**"
      - "docs/NAL_STABILIZATION_04.md"
      - "integration/nal-stabilization-03/**"
      - "nal/**"
      - "sitemap.xml"
      - ".github/workflows/nal-platform-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-contract:
    name: NAL static catalog, page and theme checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check platform validator syntax
        run: node --check scripts/check-nal-platform.mjs
      - name: Check catalog routes and indexing
        run: node scripts/check-nal-platform.mjs
      - name: Check theme behavior
        run: node scripts/check-nal-theme.mjs
      - name: Verify failure guardrails with temporary local mutations
        run: node scripts/test-nal-platform-contract-guards.mjs
      - name: Verify public catalog drift detectors offline
        run: node scripts/test-nal-catalog-contract.mjs
      - name: Compare live public Supabase RPC with repository catalog
        run: node scripts/check-nal-catalog-consistency.mjs
      - name: Check current READ-host integration snapshot without deployment
        run: node scripts/check-nal-read-integration-snapshot.mjs
      - name: Verify READ release and file-integrity guards fail closed
        run: node scripts/test-nal-read-integration-negative.mjs
      - name: Inspect P4 privacy release lock and absent owner server handler
        run: node scripts/check-nal-privacy-release-lock.mjs
      - name: Exercise P4 privacy owner browser gate with synthetic session only
        run: node scripts/test-nal-privacy-owner-ui.mjs
      - name: Verify P4 privacy lock rejects accidental feature and route activation
        run: node scripts/test-nal-privacy-lock-negative.mjs
      - name: Regress existing Auth helper with fake users and no network requests
        run: node scripts/test-nal-privacy-auth-reference.mjs
