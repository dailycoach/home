name: NAL Platform Contract CI

on:
  pull_request:
    paths:
      - "scripts/check-nal-platform.mjs"
      - "scripts/test-nal-platform-contract-guards.mjs"
      - "scripts/nal-catalog-contract.mjs"
      - "scripts/test-nal-catalog-contract.mjs"
      - "scripts/check-nal-catalog-consistency.mjs"
      - "scripts/check-nal-read-integration-snapshot.mjs"
      - "scripts/test-nal-read-integration-negative.mjs"
      - "scripts/check-nal-privacy-release-lock.mjs"
      - "scripts/test-nal-privacy-lock-negative.mjs"
      - "scripts/test-nal-privacy-owner-ui.mjs"
      - "scripts/test-nal-privacy-auth-reference.mjs"
      - "scripts/test-nal-owner-review-protocol.mjs"
      - "scripts/check-nal-payment-release-lock.mjs"
      - "scripts/test-nal-payment-release-negative.mjs"
      - "scripts/test-nal-payment-transition.mjs"
      - "integration/nal-stabilization-05/**"
      - "docs/NAL_STABILIZATION_05.md"
      - "integration/nal-commerce-lite/**"
      - "docs/NAL_COMMERCE_LITE_01.md"
      - "integration/nal-commerce-os/**"
      - "scripts/check-nal-commerce-os-ledger.mjs"
      - "docs/NAL_COMMERCE_OS_LEDGER_02.md"
      - "docs/NAL_COMMERCE_OS_API_03.md"
      - "docs/NAL_COMMERCE_OS_DELIVERY_04.md"
      - "docs/NAL_COMMERCE_OS_PASS_05.md"
      - "scripts/check-nal-commerce-os-pass.mjs"
      - "scripts/test-nal-commerce-pass-browser.mjs"
      - "scripts/test-nal-commerce-os-pass-server.mjs"
      - "scripts/test-nal-commerce-pass-negative.mjs"
      - "scripts/test-nal-commerce-pass-postgres.mjs"
      - "scripts/test-nal-commerce-os-pass-resend-races.mjs"
      - "scripts/check-nal-commerce-os-delivery.mjs"
      - "scripts/test-nal-commerce-os-delivery-worker.mjs"
      - "scripts/test-nal-commerce-os-delivery-negative.mjs"
      - "scripts/test-nal-commerce-os-delivery-races.mjs"
      - "scripts/check-nal-commerce-os-api.mjs"
      - "scripts/test-nal-commerce-os-api-bridge.mjs"
      - "scripts/test-nal-commerce-os-api-postgres.mjs"
      - "scripts/test-nal-commerce-os-receipt-race.mjs"
      - "docs/NAL_COMMERCE_OS_ADMIN_01.md"
      - "scripts/check-nal-commerce-os-admin.mjs"
      - "scripts/test-nal-commerce-os-order.mjs"
      - "scripts/test-nal-commerce-os-negative.mjs"
      - "scripts/test-nal-commerce-admin-api.mjs"
      - "scripts/test-nal-commerce-admin-ui.mjs"
      - "scripts/check-nal-commerce-lite.mjs"
      - "scripts/test-nal-commerce-lite-*.mjs"
      - "integration/nal-stabilization-04b/**"
      - "docs/NAL_STABILIZATION_04B.md"
      - "integration/nal-stabilization-04/**"
      - "docs/NAL_STABILIZATION_04.md"
      - "integration/nal-stabilization-03/**"
      - "nal/**"
      - "sitemap.xml"
      - ".github/workflows/nal-platform-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-contract:
    name: NAL static catalog, page and theme checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check platform validator syntax
        run: node --check scripts/check-nal-platform.mjs
      - name: Check catalog routes and indexing
        run: node scripts/check-nal-platform.mjs
      - name: Check theme behavior
        run: node scripts/check-nal-theme.mjs
      - name: Verify failure guardrails with temporary local mutations
        run: node scripts/test-nal-platform-contract-guards.mjs
      - name: Verify public catalog drift detectors offline
        run: node scripts/test-nal-catalog-contract.mjs
      - name: Compare live public Supabase RPC with repository catalog
        run: node scripts/check-nal-catalog-consistency.mjs
      - name: Check current READ-host integration snapshot without deployment
        run: node scripts/check-nal-read-integration-snapshot.mjs
      - name: Verify READ release and file-integrity guards fail closed
        run: node scripts/test-nal-read-integration-negative.mjs
      - name: Inspect P4 privacy release lock and absent owner server handler
        run: node scripts/check-nal-privacy-release-lock.mjs
      - name: Exercise P4 privacy owner browser gate with synthetic session only
        run: node scripts/test-nal-privacy-owner-ui.mjs
      - name: Verify P4 privacy lock rejects accidental feature and route activation
        run: node scripts/test-nal-privacy-lock-negative.mjs
      - name: Regress existing Auth helper with fake users and no network requests
        run: node scripts/test-nal-privacy-auth-reference.mjs
      - name: Check P4-B synthetic owner identity and RPC binding (NO real privileged calls)
        run: node scripts/test-nal-owner-review-protocol.mjs
      - name: Inspect P5 paid release OFF gates and postponed refund patch
        run: node scripts/check-nal-payment-release-lock.mjs
      - name: Reject payment gating and SQL approval tampering
        run: node scripts/test-nal-payment-release-negative.mjs
      - name: Test P5 refund and out-of-order settlement model without payment
        run: node scripts/test-nal-payment-transition.mjs
      - name: Regress installed Toss handler contracts offline
        run: node scripts/test-nal-toss-payments.mjs
      - name: Regress private download handler contracts offline
        run: node scripts/test-nal-digital-download.mjs
      - name: Audit guest commerce source gate and unstaged PG infrastructure
        run: node scripts/check-nal-commerce-lite.mjs
      - name: Simulate no-account storefront, offline release and receipt fragment
        run: node scripts/test-nal-commerce-lite-client.mjs
      - name: Simulate guest payment, provider authority, refund and PDF proof
        run: node scripts/test-nal-commerce-lite-server.mjs
      - name: Verify idempotent guest receipt outbox without email provider
        run: node scripts/test-nal-commerce-lite-outbox.mjs
      - name: Check Commerce Admin default-OFF source and owner safety
        run: node scripts/check-nal-commerce-os-admin.mjs
      - name: Exercise unified PDF reading/class order policy in isolation
        run: node scripts/test-nal-commerce-os-order.mjs
      - name: Verify Commerce Admin rejects unauthorized owner and payment commands
        run: node scripts/test-nal-commerce-admin-api.mjs
      - name: Verify six-section Admin UI is OFF until server bridge released
        run: node scripts/test-nal-commerce-admin-ui.mjs
      - name: Detect unsafe admin, publishing and booking changes
        run: node scripts/test-nal-commerce-os-negative.mjs
      - name: Verify P7-B isolated unified ledger is OFF and secured
        run: node scripts/check-nal-commerce-os-ledger.mjs
      - name: Guard P7-C guest API and private receipt release gates
        run: node scripts/check-nal-commerce-os-api.mjs
      - name: Simulate P7-C HMAC order reuse, PG verification, PDF delivery and program seats
        run: node scripts/test-nal-commerce-os-api-bridge.mjs
      - name: Lock unified PDF/reading/class delivery behind server and legal approval
        run: node scripts/check-nal-commerce-os-delivery.mjs
      - name: Simulate fail-closed three-kind delivery worker, refund/retry and private links
        run: node scripts/test-nal-commerce-os-delivery-worker.mjs
      - name: Reject unsafe delivery/email/sql release changes
        run: node scripts/test-nal-commerce-os-delivery-negative.mjs
      - name: Lock customer pass and resend release against unauthorized access
        run: node scripts/check-nal-commerce-os-pass.mjs
      - name: Verify customer pass noindex page, secure fragment and OFF behavior
        run: node scripts/test-nal-commerce-pass-browser.mjs
      - name: Simulate one-use attendee pass and proof-gated resend worker
        run: node scripts/test-nal-commerce-os-pass-server.mjs
      - name: Reject unsafe P7-E pass/resend/security mutations
        run: node scripts/test-nal-commerce-pass-negative.mjs

  commerce-ledger-postgres:
    name: NAL P7-B to P7-E isolated Postgres commerce integrity
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-local-pg
          POSTGRES_DB: nal_ci_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nal_ci_ledger"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: synthetic-only-local-pg
      PGDATABASE: nal_ci_ledger
      PGCONNECT_TIMEOUT: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure client is connected to ephemeral database
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          test "$PGDATABASE" = nal_ci_ledger
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT current_database()" | grep -qx nal_ci_ledger
      - name: Install independent SQL and synthetic-only fixtures (NOT Supabase)
        run: psql -X -v ON_ERROR_STOP=1 -f integration/nal-commerce-os/tests/01_bootstrap.sql
      - name: Validate order snapshot, refund/seat transitions and expiry in real Postgres
        run: psql -X -v ON_ERROR_STOP=1 -f integration/nal-commerce-os/tests/02_transactional_assertions.sql
      - name: Simulate concurrent reservations and idempotent order retries
        run: node scripts/test-nal-commerce-os-db-concurrency.mjs
      - name: Assert schema stays private and safe
        run: |
          test "$(psql -X -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='nal_private' AND c.relkind='r' AND c.relname LIKE 'commerce_os_%'")" = 7
          test "$(psql -X -Atc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='nal_private' AND p.proname LIKE 'commerce_os_%'")" = 5
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN has_table_privilege('anon','nal_private.commerce_os_orders','SELECT') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN has_function_privilege('authenticated','nal_private.commerce_os_begin_order(uuid,text,text,text,uuid,text,text,text)','EXECUTE') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS
      - name: Install P7-C guest API/receipt extension only on disposable DB
        run: psql -X -v ON_ERROR_STOP=1 -c "SET nal.commerce_os_ci_approval='isolated'" -f integration/nal-commerce-os/PROPOSAL_ONLY_guest_bridge.sql
      - name: Verify private receipt outbox and one-time order proof in actual Postgres
        run: psql -X -v ON_ERROR_STOP=1 -f integration/nal-commerce-os/tests/04_guest_bridge_assertions.sql
      - name: Reject concurrent duplicate email receipt redemptions
        run: node scripts/test-nal-commerce-os-receipt-race.mjs
      - name: Call actual private ledger from guest HTTP with synthetic PG and Storage
        run: node scripts/test-nal-commerce-os-api-postgres.mjs
      - name: Assert P7-C private schema objects not exposed to buyers
        run: |
          test "$(psql -X -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='nal_private' AND c.relkind='r' AND c.relname LIKE 'commerce_os_%'")" = 9
          test "$(psql -X -Atc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='nal_private' AND p.proname LIKE 'commerce_os_%'")" = 11
          psql -X -Atc "SELECT CASE WHEN has_table_privilege('anon','nal_private.commerce_os_receipt_tokens','SELECT') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS
          psql -X -Atc "SELECT CASE WHEN has_function_privilege('authenticated','nal_private.commerce_os_order_by_claim(uuid,text)','EXECUTE') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS

      - name: Install P7-D unified delivery SQL only in disposable Postgres
        run: psql -X -v ON_ERROR_STOP=1 -c "SET nal.commerce_os_ci_approval='isolated'" -f integration/nal-commerce-os/PROPOSAL_ONLY_delivery_engine.sql
      - name: Verify payment-driven email notifications, pass tokens and refund cancellation
        run: psql -X -v ON_ERROR_STOP=1 -f integration/nal-commerce-os/tests/05_delivery_assertions.sql
      - name: Prepare isolated email lease and pass-claim competition fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f integration/nal-commerce-os/tests/06_delivery_race_fixtures.sql
      - name: Race 8 email workers and 8 attendee one-time pass claimants
        run: node scripts/test-nal-commerce-os-delivery-races.mjs
      - name: Assert only new private tables/functions were added, no client access
        run: |
          test "$(psql -X -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='nal_private' AND c.relkind='r' AND c.relname LIKE 'commerce_os_%'")" = 11
          test "$(psql -X -Atc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='nal_private' AND p.proname LIKE 'commerce_os_%'")" = 17
          psql -X -Atc "SELECT CASE WHEN has_table_privilege('anon','nal_private.commerce_os_delivery_jobs','SELECT') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS
          psql -X -Atc "SELECT CASE WHEN has_function_privilege('authenticated','nal_private.commerce_os_lease_delivery(uuid,text)','EXECUTE') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS
          psql -X -Atc "SELECT CASE WHEN has_table_privilege('authenticated','nal_private.commerce_os_pass_claims','SELECT') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS

      - name: Install P7-E buyer-proof-only resend SQL in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -c "SET nal.commerce_os_ci_approval='isolated'" -f integration/nal-commerce-os/PROPOSAL_ONLY_pass_resend.sql
      - name: Validate private resend SQL, cooldown, refund cancellation and fixture
        run: psql -X -v ON_ERROR_STOP=1 -f integration/nal-commerce-os/tests/07_pass_resend_assertions.sql
      - name: Race 8 same-time buyer requests and 8 email worker leases
        run: node scripts/test-nal-commerce-os-pass-resend-races.mjs
      - name: Verify rolling day cap and buyer-origin proof isolation
        run: psql -X -v ON_ERROR_STOP=1 -f integration/nal-commerce-os/tests/08_pass_resend_limits.sql
      - name: Test real pass HTTP flow through isolated Postgres and mock PG
        run: node scripts/test-nal-commerce-pass-postgres.mjs
      - name: Assert P7-E private schema isolation and exact new object count
        run: |
          test "$(psql -X -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='nal_private' AND c.relkind='r' AND c.relname LIKE 'commerce_os_%'")" = 12
          test "$(psql -X -Atc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='nal_private' AND p.proname LIKE 'commerce_os_%'")" = 21
          psql -X -Atc "SELECT CASE WHEN has_table_privilege('anon','nal_private.commerce_os_pass_resend_jobs','SELECT') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS
          psql -X -Atc "SELECT CASE WHEN has_function_privilege('authenticated','nal_private.commerce_os_queue_pass_resend(uuid,text,uuid)','EXECUTE') THEN 'FAIL' ELSE 'PASS' END" | grep -qx PASS
