name: Expand RS PSYCH v1.3 bundle

on:
  push:
    branches:
      - feat/rs-psych-growth-hub-v1-3
    paths:
      - .rs-psych-v1.3-site.zip
      - .github/workflows/expand-rs-psych-v1-3.yml

permissions:
  contents: write

concurrency:
  group: expand-rs-psych-v1-3
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/rs-psych-growth-hub-v1-3
          fetch-depth: 0

      - name: Expand reviewed static bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .rs-psych-v1.3-site.zip ]]; then
            echo "Bundle already removed; nothing to expand."
            exit 0
          fi
          rm -rf rs-psych
          unzip -q .rs-psych-v1.3-site.zip -d .
          test -f rs-psych/index.html
          test -f rs-psych/trust/index.html
          test -f rs-psych/data/problem-scenes.json

      - name: Commit only the reviewed rs-psych tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rs-psych/
          if git diff --cached --quiet; then
            echo "No rs-psych changes to commit."
            exit 0
          fi
          git commit -m "feat: build RS PSYCH Growth Hub v1.3"
          git push origin HEAD:feat/rs-psych-growth-hub-v1-3
