name: NAL Positive Writing 07 Free Release
on:
  push:
    branches:
      - feat/nal-positive-writing-07-free-v11
    paths:
      - "scripts/nal-positive-writing-07/**"
      - ".github/workflows/nal-positive-writing-07-free.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nal-positive-writing-07-free-v11
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Korean PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --disable-pip-version-check reportlab==4.2.5 PyMuPDF==1.26.5 Pillow==11.1.0 pypdf==5.9.0 jsonschema==4.25.1
      - name: Regenerate final approved volume 07 v1.1 and stage metadata
        run: python scripts/nal-positive-writing-07/register_release.py
      - name: Generate storefront routes and SEO
        run: |
          node --check nal/assets/js/app.js
          node --check scripts/generate-nal-pages.mjs
          node scripts/generate-nal-pages.mjs
          node scripts/generate-nal-sitemap.mjs
      - name: Verify seven books, 21 downloads and no checkout impact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz
          R=Path(".")
          IDs=[
            "nal-positive-writing-14days",
            "nal-positive-writing-02-relationships",
            "nal-positive-writing-03-small-starts",
            "nal-positive-writing-04-self-care",
            "nal-positive-writing-05-small-joys",
            "nal-positive-writing-06-changing-days",
            "nal-positive-writing-07-self-respect"
          ]
          catalog=json.loads((R/"nal/data/products.json").read_text(encoding="utf8"))["products"]
          assert len(set(p["id"] for p in catalog if p.get("id")))==len([p for p in catalog if p.get("id")])
          listing=(R/"nal/shop/index.html").read_text(encoding="utf8")
          app=(R/"nal/assets/js/app.js").read_text(encoding="utf8")
          routes=(R/"nal/assets/js/product-routes.js").read_text(encoding="utf8")
          sitemap=(R/"sitemap.xml").read_text(encoding="utf8")
          assert "긍정문장 따라 쓰기 7권" in listing
          assert "01—07" in app
          for ident in IDs:
              p=next(x for x in catalog if x.get("id")==ident)
              assert p["published"] is True and p["price"]==0 and p["stockStatus"]=="available",ident
              assert p["deliveryType"]=="digital" and len(p["freeDownloads"])==3,ident
              assert p["purchaseUrl"]==p["freeDownloads"][0]["url"],ident
              html=(R/"nal/shop"/ident/"index.html").read_text(encoding="utf8")
              for other in IDs:
                  assert "/nal/shop/"+other+"/" in html,(ident,other)
              for row in p["freeDownloads"]:
                  asset=R/row["url"].lstrip("/")
                  assert asset.is_file() and asset.stat().st_size>100_000,asset
                  if ident==IDs[-1]:
                      assert row["url"] in html,row["url"]
                      with fitz.open(asset) as pdf:
                          assert pdf.page_count==40,(asset,pdf.page_count)
              assert ident in listing and ident in routes and ident in sitemap
          cover=R/"nal/assets/images/catalog/shop/retail/nal-positive-writing-07-self-respect-v11-cover.png"
          assert cover.is_file() and cover.stat().st_size>50_000
          paid=[p for p in catalog if isinstance(p.get("price"),int) and p["price"]>0]
          urls={v["url"] for p in catalog if p["id"]==IDs[-1] for v in p["freeDownloads"]}
          assert all(x.get("purchaseUrl") not in urls for x in paid)
          assert "const positiveSeries" in app
          print("PASS: 7 free books / 21 direct PDF links / cross-navigation / sitemap / paid isolation")
          PY
      - name: Commit generated PDFs, cover and catalog in release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nal/assets/downloads/free/nal-positive-writing-07-self-respect-v11-a5.pdf
          git add nal/assets/downloads/free/nal-positive-writing-07-self-respect-v11-a4-print.pdf
          git add nal/assets/downloads/free/nal-positive-writing-07-self-respect-v11-fillable.pdf
          git add nal/assets/images/catalog/shop/retail/nal-positive-writing-07-self-respect-v11-cover.png
          git add nal/data/products.json nal/data/routes.json nal/assets/js/product-routes.js
          git add nal/shop sitemap.xml
          git diff --cached --check -- nal/data/products.json nal/data/routes.json nal/assets/js/product-routes.js nal/shop sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build(nal): publish validated volume 07 and seven-book links [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
