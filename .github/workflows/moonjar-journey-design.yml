name: Moonjar Whole Journey Design QA

on:
  pull_request:
    paths:
      - 'activities/moonjar/**'
      - 'scripts/check-moonjar-journey.mjs'
      - '.github/workflows/moonjar-journey-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original Moonjar assets and app syntax
        run: node scripts/check-moonjar.mjs
      - name: Test Moonjar domain and persistence, including real scenes
        run: node --test tests/moonjar/*.test.js
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Serve the actual Moonjar app (PR branch, not production)
        run: |
          python3 -m http.server 4173 >/tmp/moonjar-journey-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/activities/moonjar/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/moonjar-journey-http.log
          exit 1
      - name: Inspect non-art pages and user journey through real browsers
        run: node scripts/check-moonjar-journey.mjs
      - name: Upload desktop and mobile editorial review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonjar-whole-journey-visual-qa
          path: artifacts/moonjar-journey-design/
          retention-days: 7
          if-no-files-found: warn
