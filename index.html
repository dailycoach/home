<body>
  <main class="loading">
    <section>
      <h1>문제보다 존재를 먼저 보는 코칭</h1>
      <p>데일리코칭은 깊이 듣고 정리하며 삶의 방향을 함께 세우는 코칭 브랜드입니다.</p>
      <nav aria-label="주요 서비스">
        <a href="/company/">기업소개</a>
        <a href="/coach/">코치소개</a>
        <a href="/coaching/coach-the-coach/">코치더코치</a>
        <a href="/nal/">NAL 플랫폼</a>
        <a href="/tests/kgm210/">자기이해 검사</a>
        <a href="/activities/value-scene/">코칭 활동도구</a>
      </nav>
    </section>
  </main>
  <script>
    fetch('/index-source-disc.html?v=20260815-home-hotfix', {cache:'no-store'})
      .then(r => textOrThrow(r))
      .then(html => {
        const anchor = '<a href="/tests/kgm210/" data-route="kgm210">KGM210 성장코칭 <small>→</small></a>';
        const links = `${anchor}\n            <a href="/tests/my-voice/" data-route="myVoice">MY VOICE 스피치 알아차림 <small>NEW</small></a>\n            <a href="/tests/flourish-awareness/" data-route="flourishAwareness">플로리싱 × 알아차림 <small>NEW</small></a>\n            <a href="/tests/disc16/" data-route="disc16">DISC16 행동스타일 검사 <small>NEW</small></a>\n            <a href="/tests/disc16-youth/" data-route="disc16Youth">DISC16 청소년 관계행동 <small>NEW</small></a>`;
        html = html.replaceAll(anchor, links);
        html = html.replace(
          "      kgm210: '/tests/kgm210/',",
          "      kgm210: '/tests/kgm210/',\n      myVoice: '/tests/my-voice/',\n      flourishAwareness: '/tests/flourish-awareness/',\n      disc16: '/tests/disc16/',\n      disc16Youth: '/tests/disc16-youth/',"
        );

        const nalUrl = '/nal/';
        const nalTopAnchor = '<a class="nav-link" href="https://smartstore.naver.com/nalbitcoaching" data-route="booking">1:1 코칭</a>';
        const nalTopLink = `<a class="nav-link" href="${nalUrl}" data-route="nal">NAL</a>`;
        if (!html.includes('class="nav-link" href="/nal/" data-route="nal"')) {
          html = html.replace(nalTopAnchor, `${nalTopLink}\n        ${nalTopAnchor}`);
        }

        const nalPanelAnchor = '        <article class="category" data-category="program">';
        const nalPanelCategory = `        <article class="category" data-category="nal">\n          <h3>NAL</h3>\n          <p>모임·원데이클래스·감정카드와 자기이해 도구를 한곳에서 만납니다.</p>\n          <a href="/nal/" data-route="nal">NAL 플랫폼 홈 <small>OPEN</small></a>\n          <a href="/nal/gather/">모임 둘러보기 <small>→</small></a>\n          <a href="/nal/class/">원데이클래스 <small>→</small></a>\n          <a href="/nal/shop/">스토어 <small>→</small></a>\n        </article>\n\n`;
        if (!html.includes('data-category="nal"')) {
          html = html.replace(nalPanelAnchor, `${nalPanelCategory}${nalPanelAnchor}`);
        }

        if (!html.includes("      nal: '/nal/',")) {
          html = html.replace("      booking: 'https://smartstore.naver.com/nalbitcoaching',\n      lcms: '/lcms/',", "      booking: 'https://smartstore.naver.com/nalbitcoaching',\n      nal: '/nal/',\n      lcms: '/lcms/',");
        }

        const careerGameUrl = '/activities/career-deduction-game/';
        const desktopActivityAnchor = '<a href="/activities/wilderness-survival/" data-route="wildernessSurvival">광야 서바이벌 <small>→</small></a>';
        const panelActivityAnchor = '<a href="/activities/wilderness-survival/" data-route="wildernessSurvival">광야 서바이벌 활동도구 <small>→</small></a>';
        const desktopCareerLink = `<a href="${careerGameUrl}">내 직업을 맞춰봐! <small>V2</small></a>`;
        const panelCareerLink = `<a href="${careerGameUrl}">내 직업을 맞춰봐! · 보너스 러시 <small>V2</small></a>`;
        const flexMoveLink = '<a href="/activities/coaching-flex-move/" data-route="coachingFlexMove">COACHING FLEX MOVE <small>V4</small></a>';
        const flexMovePanelLink = '<a href="/activities/coaching-flex-move/" data-route="coachingFlexMove">COACHING FLEX MOVE · 셀프코칭 × 현장코칭 <small>V4</small></a>';
        const valueSceneLink = '<a href="/activities/value-scene/" data-route="valueScene">VALUE SCENE <small>GEN Z</small></a>';
        const valueScenePanelLink = '<a href="/activities/value-scene/" data-route="valueScene">VALUE SCENE · 지금의 나를 움직이는 감각 편집 <small>GEN Z</small></a>';

        if (!html.includes(`${desktopCareerLink}\n            ${desktopActivityAnchor}`)) {
          html = html.replace(desktopActivityAnchor, `${desktopCareerLink}\n            ${desktopActivityAnchor}`);
        }
        if (!html.includes(`${panelCareerLink}\n          ${panelActivityAnchor}`)) {
          html = html.replace(panelActivityAnchor, `${panelCareerLink}\n          ${panelActivityAnchor}`);
        }
        if (!html.includes(flexMoveLink)) {
          html = html.replace(desktopActivityAnchor, `${flexMoveLink}\n            ${desktopActivityAnchor}`);
        }
        if (!html.includes(flexMovePanelLink)) {
          html = html.replace(panelActivityAnchor, `${flexMovePanelLink}\n          ${panelActivityAnchor}`);
        }
        if (!html.includes(valueSceneLink)) {
          html = html.replace(desktopActivityAnchor, `${valueSceneLink}\n            ${desktopActivityAnchor}`);
        }
        if (!html.includes(valueScenePanelLink)) {
          html = html.replace(panelActivityAnchor, `${valueScenePanelLink}\n          ${panelActivityAnchor}`);
        }
        html = html.replace("      liveBoard: '/activities/live-board/',", "      coachingFlexMove: '/activities/coaching-flex-move/',\n      liveBoard: '/activities/live-board/',");
        html = html.replace("      liveBoard: '/activities/live-board/',", "      valueScene: '/activities/value-scene/',\n      liveBoard: '/activities/live-board/',");

        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = '<div class="loading"><p>페이지를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p></div>';
      });

    function textOrThrow(response) {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.text();
    }
  </script>
