<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DAILYCOACHING</title>
  <style>html,body{margin:0;background:#061528;color:#fff;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.loading p{opacity:.7}</style>
</head>
<body>
  <div class="loading"><p>DAILYCOACHING을 불러오는 중입니다.</p></div>
  <script>
    fetch('/index-source-disc.html?v=20260801-coaching-v1', { cache: 'no-store' })
      .then(r => textOrThrow(r))
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch((error) => {
        console.error('DAILYCOACHING homepage load failed.', error);
        document.body.innerHTML = '<div class="loading"><p>페이지를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p></div>';
      });

    function textOrThrow(response) {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.text();
    }
  </script>
</body>
</html>
