<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="NAL 셀프코칭 에세이 3권 세트"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="5"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="900" height="1200" fill="#0b2218"/><rect width="900" height="1200" opacity=".06" filter="url(#grain)"/><text x="450" y="162" fill="#e0b378" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo',serif" font-size="52">내 탓으로 끝내지 않기로 했다</text><text x="450" y="226" fill="#d4a56a" text-anchor="middle" font-family="'Noto Serif KR','Nanum Myeongjo',serif" font-size="24">선택 · 관계 · 책임  /  셀프코칭 에세이 3부작</text><g font-family="'Noto Serif KR','Nanum Myeongjo',serif" text-anchor="middle" fill="#e7bd81"><g transform="translate(125 360)"><rect width="195" height="490" rx="2" fill="#0d2b1e" stroke="#ad8455"/><text x="98" y="115" font-size="22">내 선택을</text><text x="98" y="147" font-size="22">믿는 연습</text><text x="98" y="440" font-size="21">01</text></g><g transform="translate(353 360)"><rect width="195" height="490" rx="2" fill="#0d2b1e" stroke="#ad8455"/><text x="98" y="110" font-size="19">상대의 반응이</text><text x="98" y="143" font-size="19">나의 가치는</text><text x="98" y="176" font-size="19">아니니까</text><text x="98" y="440" font-size="21">02</text></g><g transform="translate(581 360)"><rect width="195" height="490" rx="2" fill="#0d2b1e" stroke="#ad8455"/><text x="98" y="110" font-size="19">모든 일이</text><text x="98" y="143" font-size="19">내 책임은</text><text x="98" y="176" font-size="19">아니었다</text><text x="98" y="440" font-size="21">03</text></g></g><text x="450" y="967" text-anchor="middle" fill="#e0b378" font-family="'Noto Serif KR','Nanum Myeongjo',serif" font-size="25">김철웅  ·  35쪽 × 3권</text><text x="450" y="1100" text-anchor="middle" fill="#e0b378" font-family="Georgia,serif" font-size="30" letter-spacing="10">NAL</text></svg>